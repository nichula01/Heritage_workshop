[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "heritage-workshop"
version = "0.1.0"
description = "Adaptive Evidence Routing for cultural heritage visual question answering."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "TODO" }
]
dependencies = [
  "matplotlib",
  "numpy",
  "pandas",
  "pillow",
  "pyyaml",
  "requests",
  "scikit-learn"
]

[project.optional-dependencies]
models = [
  "accelerate",
  "einops",
  "qwen-vl-utils",
  "sentencepiece",
  "torch",
  "torchvision",
  "transformers"
]
dev = [
  "black",
  "pytest",
  "ruff",
  "tomli; python_version < '3.11'"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src", "src.*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.black]
line-length = 100
target-version = ["py310"]
